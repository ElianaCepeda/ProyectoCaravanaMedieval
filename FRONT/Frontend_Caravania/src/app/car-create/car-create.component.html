<div class="banner-container">
    <div class="icon-container"></div>
    <h1 class="listTitle">Crear caravana</h1>
</div>
<div class="foreground-text-aux"></div>

<div class="main-content">
    <div class="character-image">
      <img [src]="currentCharacter.img" alt="character" />
    </div>
</div>


<div class="controls">
  <button (click)="anterior()" class="arrow">
    <img [src]="flechaImg" class="arrow-img flipped" alt="Flecha izquierda">
  </button>
  <button (click)="siguiente()" class="arrow">
    <img [src]="flechaImg" class="arrow-img" alt="Flecha derecha">
  </button>
</div>


<div class="confirm-container">
  <button class="confirm">Confirmar</button>
</div>
