<!-- Contenedor del visor OpenSeadragon -->
<div id="opensea-container"></div>

<!-- Ciudad actual -->
<div id="ciudad-actual" class="ciudad-marcador ciudad-actual">
  <!-- Punto visual rojo para la ciudad actual -->
  <div class="ciudad-punto-actual"></div>
  <div class="ciudad-tooltip">
    {{ actualCity?.nombre }} (Tarifa: {{ actualCity?.tarifa }})
  </div>
</div>

<!-- Ciudades adyacentes -->
<div
  *ngFor="let city of adjacentCities; let i = index"
  [id]="'ciudad-adyacente-' + i"
  class="ciudad-marcador ciudad-adyacente"
>
  <!-- Punto visual para ciudades adyacentes -->
  <div class="ciudad-punto-adyacente"></div>
  <div class="ciudad-menu">
    <div class="city-title">{{ city.nombre }}</div>
    <div class="city-info">
      <p><strong>Tarifa:</strong> {{ city.tarifa }}</p>
    </div>
  </div>
</div>

<!-- Barra flotante de vida/dinero -->
<div class="floating-ui top-left">
  <app-player-ui [vida]="vidaActual" [mostrarDinero]="false"></app-player-ui>
</div>
<div class="floating-ui bottom-right">
  <app-player-ui [dinero]="dineroActual" [mostrarVida]="false"></app-player-ui>
</div>

<div class="floating-ui bottom-right-tiempo">
  <div class="tiempo-display">
    {{ displayTime }}
    <span class="tiempo-icon">{{ getTiempoIcon() }}</span>
  </div>
</div>

<!-- Botones de navegación -->
<div class="action-buttons">
  <button class="action-btn" (click)="goCommerce()">Comerciar</button>
  <button class="action-btn" (click)="goService()">Servicios</button>
  <button class="action-btn" (click)="goTravel()">Viajar</button>
  <button class="action-btn" (click)="goCaravan()">Caravana</button>
</div>
