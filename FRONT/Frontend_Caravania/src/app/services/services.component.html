<div class="center-box">
  <h2 class="title-header">Servicios disponibles</h2>

  <!-- Contenedor fijo en la parte superior derecha dentro del center-box -->
<div class="top-ui">
  <app-player-ui [vida]="vidaActual" [mostrarDinero]="false"></app-player-ui>
  <app-player-ui [dinero]="dineroActual" [mostrarVida]="false"></app-player-ui>
</div>


  <table class="service-table">
    <thead>
      <tr>
        <th>SERVICIO</th>
        <th>VALOR</th>
        <th>ACCIONES</th>
      </tr>
    </thead>
    <tbody>
      <tr *ngFor="let servicio of servicios">
        <td><strong>{{ servicio.nombre }}</strong></td>
        <td>{{ servicio.valor }}</td>
        <td>
          <button class="button2" (click)="consultar(servicio)">Consultar</button>
          <button class="button2" (click)="comprar(servicio)">Comprar</button>
        </td>
      </tr>
    </tbody>
  </table>
  

  
  

<div class="return-container">
  <button class="button" (click)="btnClick()">devolverse</button>
</div>
