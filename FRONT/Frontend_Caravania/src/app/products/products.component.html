<div class="center-box">
  <h2 class="title-header">Tus productos</h2>

  <!-- UI flotante arriba derecha -->
  <div class="top-ui">
    <app-player-ui [vida]="vidaActual" [mostrarDinero]="false"></app-player-ui>
    <app-player-ui [dinero]="dineroActual" [mostrarVida]="false"></app-player-ui>
  </div>

  <div class="return-container">
    <button class="button" (click)="btnClick()">devolverse</button>
  </div>

  <!-- Contenedor de tabla scrollable -->
  <div class="table-scroll">
    <table class="service-table">
      <thead>
        <tr>
          <th>PRODUCTO</th>
          <th>CANTIDAD</th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let item of productos">
          <td>{{ item.productoNombre }}</td>
          <td>{{ item.cantidad }}</td>
        </tr>
        <tr *ngIf="productos.length === 0">
          <td colspan="2">No tienes productos comprados.</td>
        </tr>
      </tbody>
    </table>
  </div>
</div>
